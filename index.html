<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sajiwa - Menu Digital</title>
<style>
  :root{
    --maroon:#4A0E0E;
    --maroon-deep:#3A0A0A;
    --cream:#F3E7CE;
    --terracotta:#D97757;
    --gold:#E0B24C;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background: radial-gradient(circle at 50% 0%, #5A1414 0%, var(--maroon-deep) 70%);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow-x:hidden;
    padding:18px 12px 100px;
  }

  .heading{
    text-align:center;
    color:var(--cream);
    margin-bottom:16px;
  }
  .heading .eyebrow{
    display:inline-block;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--maroon-deep);
    background:var(--gold);
    padding:4px 12px;
    border-radius:999px;
    font-weight:700;
    margin-bottom:10px;
  }
  .heading h1{
    font-size:22px;
    margin:0;
    font-weight:700;
    letter-spacing:-.01em;
  }

  /* ---------- FLIPBOOK ---------- */
  .stage{
    perspective: 2400px;
    width:min(88vw, 340px);
  }
  .book{
    position:relative;
    width:100%;
    aspect-ratio: 900 / 1272;
    border-radius:10px;
    box-shadow:
      0 30px 60px rgba(0,0,0,.5),
      0 8px 20px rgba(0,0,0,.4);
  }
  .book::before{
    /* spine shadow on the left, book binding illusion */
    content:"";
    position:absolute;
    left:-6px; top:4%;
    width:14px; height:92%;
    background:linear-gradient(90deg, transparent, rgba(0,0,0,.35));
    border-radius:6px;
    z-index:0;
  }
  .leaf{
    position:absolute;
    inset:0;
    border-radius:10px;
    overflow:hidden;
    background:var(--cream);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
  .leaf img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  .leaf.bottom{ z-index:1; }
  .leaf.top{
    z-index:2;
    transform-origin: left center;
    transform: rotateY(0deg);
    transition: transform .85s cubic-bezier(.62,.05,.4,1);
  }
  .leaf.top::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 14%, rgba(0,0,0,0) 86%, rgba(0,0,0,.12) 100%);
    opacity:0;
    transition:opacity .85s ease;
    pointer-events:none;
  }
  .leaf.top.flip-fwd{ transform: rotateY(-178deg); }
  .leaf.top.flip-fwd::after{ opacity:1; }
  .leaf.top.flip-back{ transform: rotateY(178deg); }
  .leaf.top.flip-back::after{ opacity:1; }

  /* ---------- CONTROLS ---------- */
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-top:22px;
  }
  .nav-btn{
    width:44px; height:44px;
    border-radius:50%;
    border:1.5px solid rgba(243,231,206,.35);
    background:rgba(243,231,206,.08);
    color:var(--cream);
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: background .15s ease, transform .1s ease, opacity .2s;
  }
  .nav-btn:active{ transform:scale(.92); }
  .nav-btn:disabled{ opacity:.25; cursor:default; }
  .nav-btn:not(:disabled):hover{ background:rgba(243,231,206,.18); }

  .dots{
    display:flex;
    gap:7px;
  }
  .dot{
    width:7px; height:7px;
    border-radius:50%;
    background:rgba(243,231,206,.3);
    transition: background .2s ease, transform .2s ease;
  }
  .dot.active{
    background:var(--gold);
    transform:scale(1.3);
  }

  .hint{
    margin-top:14px;
    font-size:12px;
    color:rgba(243,231,206,.55);
    text-align:center;
  }

  /* ---------- FLOATING WHATSAPP ---------- */
  .float-wa{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:340px;
    padding:0 20px;
    z-index:50;
  }
  .float-wa a{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    background:var(--terracotta);
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    padding:14px 18px;
    border-radius:999px;
    box-shadow:0 8px 20px rgba(217,119,87,.45);
  }
</style>
</head>

  const total = images.length;
  let current = 0;
  let animating = false;

  const leafTop = document.getElementById('leafTop');
  const leafBottom = document.getElementById('leafBottom');
  const imgTop = document.getElementById('imgTop');
  const imgBottom = document.getElementById('imgBottom');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const dotsWrap = document.getElementById('dots');

  for(let i=0;i<total;i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i===0?' active':'');
    dotsWrap.appendChild(d);
  }
  const dots = dotsWrap.querySelectorAll('.dot');

  function updateDots(){
    dots.forEach((d,i)=> d.classList.toggle('active', i===current));
  }

  function updateButtons(){
    prevBtn.disabled = current === 0 || animating;
    nextBtn.disabled = current === total-1 || animating;
  }

  function init(){
    imgTop.src = images[current];
    imgBottom.src = images[current+1] || images[current];
    updateButtons();
    updateDots();
  }

  function goNext(){
    if(animating || current >= total-1) return;
    animating = true;
    updateButtons();
    imgBottom.src = images[current+1];
    leafTop.classList.add('flip-fwd');
    setTimeout(()=>{
      current++;
      // snap back instantly without re-triggering the CSS transition
      leafTop.style.transition = 'none';
      leafTop.classList.remove('flip-fwd');
      void leafTop.offsetWidth;
      imgTop.src = images[current];
      imgBottom.src = images[current+1] || images[current];
      leafTop.style.transition = '';
      animating = false;
      updateButtons();
      updateDots();
    }, 850);
  }

  function goPrev(){
    if(animating || current <= 0) return;
    animating = true;
    updateButtons();
    // prepare top leaf to show the PREVIOUS page, pre-rotated to back position
    leafTop.style.transition = 'none';
    imgTop.src = images[current-1];
    leafTop.classList.add('flip-back');
    // force reflow so the instant class application takes effect before re-enabling transition
    void leafTop.offsetWidth;
    imgBottom.src = images[current];
    leafTop.style.transition = '';
    requestAnimationFrame(()=>{
      leafTop.classList.remove('flip-back');
    });
    setTimeout(()=>{
      current--;
      imgTop.src = images[current];
      imgBottom.src = images[current+1] || images[current];
      animating = false;
      updateButtons();
      updateDots();
    }, 850);
  }

  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowRight') goNext();
    if(e.key === 'ArrowLeft') goPrev();
  });

  // swipe support
  let touchStartX = null;
  const book = document.getElementById('book');
  book.addEventListener('touchstart', (e)=>{
    touchStartX = e.touches[0].clientX;
  }, {passive:true});
  book.addEventListener('touchend', (e)=>{
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40){
      if(dx < 0) goNext(); else goPrev();
    }
    touchStartX = null;
  }, {passive:true});

  init();
</script>
</body>
</html>
